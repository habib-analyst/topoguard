[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topoguard"
version = "0.1.0"
description = "Topology-adaptive Byzantine defense for decentralized federated learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
keywords = ["federated-learning", "byzantine", "decentralized", "robust-aggregation"]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["topoguard*"]
